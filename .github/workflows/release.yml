name: Download release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.6.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Run tests
        run: ./tests/run.sh
      - name: Build and package without certificate signing
        run: ./scripts/package-release.sh "${RELEASE_TAG#v}"
      - name: Retain downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MenuBarCompact-${{ env.RELEASE_TAG }}-macOS-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" >/dev/null || { echo 'This release is already published; create a new version instead.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "MenuBarCompact $RELEASE_TAG" --generate-notes \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
